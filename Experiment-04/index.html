<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h2>Student Result Calculator</h2>
        <div class="input-group">
            <label for="subjectCount">Enter Number of Subjects</label>
            <input type="number" id="subjectCount" min="1" value="5">
        </div>
        <button id="calculateBtn">Calculate Result</button>
        <div id="resultDisplay" class="result-box"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>

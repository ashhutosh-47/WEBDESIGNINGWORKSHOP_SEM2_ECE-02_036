<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation and Event Handling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1 id="mainHeading">Welcome to Web Development</h1>
        <p id="mainParagraph">This is a dynamic paragraph content that can be manipulated using DOM methods and event listeners.</p>
        
        <div class="input-section">
            <input type="text" id="textInput" placeholder="Enter new heading text...">
            <button id="changeTextBtn">Update Heading</button>
        </div>

        <div class="control-panel">
            <button id="colorBtn" class="btn-color">Change Background</button>
            <button id="sizeBtn" class="btn-size">Increase Font Size</button>
            <button id="toggleBtn" class="btn-toggle">Hide Paragraph</button>
            <button id="resetBtn" class="btn-reset">Reset Page</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
